[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"

[runner]
# VerseVAD uses explicit Streamlit output calls. Disabling unused magic syntax
# avoids reparsing the large application source on every widget rerun.
magicEnabled = false

[server]
maxUploadSize = 5
runOnSave = false
# Community Cloud handles GitHub deployments itself. Disabling Streamlit's
# recursive filesystem watcher avoids exhausting the hosted Linux inotify
# allowance while retaining normal widget reruns and repository redeploys.
fileWatcherType = "none"

[theme]
primaryColor = "#A34F32"
backgroundColor = "#FBF8F1"
secondaryBackgroundColor = "#F3EFE5"
textColor = "#172A3A"
font = "sans-serif"
