[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "versevad"
version = "1.0.0"
description = "Transparent local lexical-evidence analysis for literary texts"
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
authors = [{ name = "VerseVAD Development" }]
dependencies = [
  "click==8.4.2",
  "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
  "espeakng-loader==0.2.4",
  "openpyxl==3.1.5",
  "numpy==2.5.1",
  "pronouncing==0.3.0",
  "python-docx==1.2.0",
  "spacy==3.8.14",
  "streamlit==1.60.0",
  "vadersentiment==3.3.2",
]

[project.scripts]
versevad-phase1-demo = "versevad.demo:main"
versevad-phase2-demo = "versevad.phase2_demo:main"
versevad-concreteness-demo = "versevad.concreteness_validation:main"
versevad-frequency-demo = "versevad.frequency_validation:main"
versevad-aoa-demo = "versevad.aoa_validation:main"
versevad-pronunciation-demo = "versevad.pronunciation_validation:main"
versevad-meter-demo = "versevad.meter_validation:main"
versevad-phonology-demo = "versevad.phonology_validation:main"
versevad-lexical-style-demo = "versevad.lexical_style_validation:main"
versevad-inherited-form-demo = "versevad.inherited_form_validation:main"
versevad-diagnose = "versevad.diagnostics:main"
versevad-update-versemap = "versevad.versemap.reference:main"

[dependency-groups]
dev = [
  "pytest==9.1.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/versevad"]

[tool.hatch.build.targets.sdist]
exclude = [
  "/.agents",
  "/.git",
  "/.pytest_cache",
  "/.runtime",
  "/.tools",
  "/.uv-cache",
  "/.venv",
  "/backups",
  "/build",
  "/corpora",
  "/data",
  "/dist",
  "/exports",
  "/output",
  "/phase1_demo_output",
  "/phase2_demo_output",
  "/projects",
  "/resources",
  "/source_lexicons",
  "/source_texts",
  "/tmp",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
pythonpath = ["src", "."]
testpaths = ["tests"]
